<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Last Lighthouse tests</title></head>
<body>
<pre id="out"></pre>
<script>window.__NO_BOOT = true;</script>
<script src="config.js"></script>
<script src="sprites.js"></script>
<script src="telemetry.js"></script>
<script src="story.js"></script>
<script src="art.js"></script>
<script src="lighthouse.js"></script>
<script>
"use strict";
const results = [];
function test(name, fn) {
  try { fn(); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, err: String(e && e.message || e) }); }
}
function assert(c, msg) { if (!c) throw new Error(msg); }

const FONT_OK = (text) => [...text.toUpperCase()].every((ch) => FONT[ch]);
const allLines = [];

// run a list of actions the way the engine does (dialogue lines are just recorded)
function play(s, actions) {
  for (const a of actions) {
    if (a.say) { allLines.push(a.say); continue; }
    Story.apply(s, a);
    if (a.go) Story.SCENES[s.scene].enter(s).forEach((b) => (b.say ? allLines.push(b.say) : Story.apply(s, b)));
  }
}

// follow the goal list (the same data the hint button uses) until the game ends
function solveFrom(s, maxSteps = 60) {
  for (let i = 0; i < maxSteps && !s.done; i++) {
    const g = Story.currentGoal(s);
    if (!g) break;
    const [scene, a, b] = g.act;
    if (scene === "*") play(s, Story.combine(s, a, b));
    else { s.scene = scene; play(s, Story.interact(s, a, b || null)); }
    if (!g.done(s)) throw new Error(`goal ${g.id} not reached by its own solution (scene ${scene})`);
  }
  return s;
}

test("the walkthrough finishes the game and solves every step", () => {
  const s = solveFrom(Story.newState());
  assert(s.done, "game not finished");
  for (const step of Story.STEPS) assert(s.solved.includes(step), "step never solved: " + step);
  assert(s.solved.length === Story.STEPS.length, "unknown steps solved: " + s.solved.join(","));
});

test("every goal has two hints that fit the dialogue box", () => {
  for (const g of Story.GOALS) {
    assert(g.hint.length === 2, g.id + ": needs 2 hint tiers");
    for (const h of g.hint) {
      assert(FONT_OK(h), `${g.id}: hint has characters the font can't draw: ${h}`);
      assert(wrap(h, 52).length <= 3, `${g.id}: hint too long: ${h}`);
    }
  }
});

test("hotspots sit inside the scene and have walk targets on the floor", () => {
  for (const [id, sc] of Object.entries(Story.SCENES)) {
    for (const h of sc.hotspots) {
      const [x, y, w, hh] = h.rect;
      assert(x >= 0 && y >= 0 && x + w <= 320 && y + hh <= 140, `${id}/${h.id} outside the scene`);
      assert(h.walkX === null || (h.walkX >= 0 && h.walkX <= 320), `${id}/${h.id} bad walkX`);
      assert(FONT_OK(h.name), `${id}/${h.id} name not drawable`);
    }
    for (const [from, x] of Object.entries(sc.entries)) assert(Story.SCENES[from] && x >= 0 && x <= 320, `${id}: bad entry from ${from}`);
  }
});

test("random play never crashes, never gets stuck, and every line is drawable", () => {
  let seed = 12345;
  const r = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  const pick = (arr) => arr[Math.floor(r() * arr.length)];
  const items = Object.keys(Story.ITEMS);
  for (let game = 0; game < 300; game++) {
    const s = Story.newState();
    const n = Math.floor(r() * 120);
    for (let i = 0; i < n && !s.done; i++) {
      const roll = r();
      if (roll < 0.15) { s.scene = pick(Object.keys(Story.SCENES)); continue; }
      if (roll < 0.25 && s.inv.length >= 2) { play(s, Story.combine(s, pick(s.inv), pick(s.inv))); continue; }
      const hs = pick(Story.visibleHotspots(s));
      const item = r() < 0.5 && s.inv.length ? pick(s.inv) : null;
      play(s, Story.interact(s, hs.id, item));
      for (const it of s.inv) assert(items.includes(it), "unknown item " + it);
    }
    solveFrom(s);
    assert(s.done, `game ${game}: stuck after random play`);
  }
  for (const line of allLines) {
    assert(FONT_OK(line), "line has characters the font can't draw: " + line);
    assert(wrap(line, 52).length <= 3, "line too long for the dialogue box: " + line);
  }
});

test("hint button: vague hint first, specific hint on the second press", () => {
  const game = new Game(document.createElement("canvas"));
  game.start(false);
  game.queue = [];
  const g = Story.currentGoal(game.s);
  game.hint();
  assert(game.queue.pop().say === g.hint[0], "first press should give the vague hint");
  game.hint();
  assert(game.queue.pop().say === g.hint[1], "second press should give the specific hint");
  assert(game.s.hints === 2, "hints counted");
});

test("the real engine plays to the ending and only sends events the database accepts", () => {
  const allowed = ["session_start", "exposure", "game_start", "scene_enter", "puzzle_solved", "hint_used",
    "game_complete", "session_end", "client_error"];
  const sent = [];
  const orig = Telemetry.track;
  Telemetry.track = (e, p) => { sent.push(e); orig(e, p); };
  try {
    const game = new Game(document.createElement("canvas"));
    game.start(false);
    game.hint();
    for (let i = 0; i < 20000 && game.mode === "play"; i++) {
      if (game.dlg) { game.dlg.shown = game.dlg.text.length; game.advance(); continue; }
      if (!game.fade && !game.walk && !game.queue.length) {
        const g = Story.currentGoal(game.s);
        if (!g) break;
        const [scene, a, b] = g.act;
        if (scene === "*") game.run(Story.combine(game.s, a, b));
        else if (game.s.scene !== scene) game.run([{ go: scene }]);
        else game.run(Story.interact(game.s, a, b || null));
      }
      game.step(0.1);
    }
    for (let i = 0; i < 10; i++) game.step(0.1);
    assert(game.s.done && game.mode === "ending", "engine did not reach the ending");
    for (const e of sent) assert(allowed.includes(e), "event the database would reject: " + e);
    assert(sent.filter((e) => e === "puzzle_solved").length === Story.STEPS.length, "one puzzle_solved per step");
    assert(sent.includes("game_complete"), "game_complete sent");
  } finally { Telemetry.track = orig; }
  assert(CONFIG.GAME_VERSION.length <= 16, "game_version too long for the database");
});

test("clicks: walk to the boat, take the rope, use it on the well from the bag", () => {
  const game = new Game(document.createElement("canvas"));
  game.start(false);
  const settle = () => {
    for (let i = 0; i < 400; i++) {
      if (game.dlg) { game.click({ x: 160, y: 160 }); game.click({ x: 160, y: 160 }); }
      game.step(0.05);
    }
  };
  const center = (scene, id) => {
    const r = Story.SCENES[scene].hotspots.find((h) => h.id === id).rect;
    return { x: r[0] + r[2] / 2, y: r[1] + r[3] / 2 };
  };
  settle();                                   // intro lines
  game.click(center("beach", "wreck")); settle();
  assert(game.s.inv.includes("rope"), "rope not taken by clicking the boat");
  game.click(center("beach", "to_village")); settle();
  assert(game.s.scene === "village", "exit click did not change scene");
  game.click({ x: SLOT.x + 5, y: SLOT.y + 5 });
  assert(game.selected === "rope", "clicking the bag slot should select the rope");
  game.click(center("village", "well")); settle();
  assert(game.s.inv.includes("key") && !game.s.inv.includes("rope"), "rope on well should give the key");
  game.click({ x: HINT_BTN.x + 5, y: HINT_BTN.y + 5 });
  assert(game.dlg || game.queue.length, "hint button gave no hint");
});

document.getElementById("out").textContent = results.map((r) => (r.ok ? "PASS " : "FAIL ") + r.name + (r.ok ? "" : " -> " + r.err)).join("\n");
const collector = new URLSearchParams(location.search).get("collector");
if (collector) fetch(collector + "/done", { method: "POST", body: JSON.stringify(results) });
</script>
</body>
</html>
