version: 2
models:
  - name: fct_runs
    columns:
      - name: run_id
        tests: [unique, not_null]
      - name: duration_s
        tests: [not_null]
      - name: cause
        tests:
          - accepted_values:
              arguments:
                values: [caught, fell, quit]
      - name: player_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
  - name: fct_sessions
    columns:
      - name: session_id
        tests: [unique, not_null]
  - name: dim_players
    columns:
      - name: player_id
        tests: [unique, not_null]
  - name: exp_player_metrics
    columns:
      - name: player_id
        tests: [unique, not_null]
